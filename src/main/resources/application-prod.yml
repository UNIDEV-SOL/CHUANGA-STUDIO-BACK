# Perfil de produção: ativar com SPRING_PROFILES_ACTIVE=prod.
# Os segredos não têm valor por omissão — se a variável de ambiente faltar,
# a aplicação recusa-se a arrancar.

spring:
  datasource:
    password: ${DB_PASSWORD}

jwt:
  secret: ${JWT_SECRET}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS}
  admin:
    seed-email: ${ADMIN_SEED_EMAIL}
    seed-password: ${ADMIN_SEED_PASSWORD}
  email:
    resend-api-key: ${RESEND_API_KEY}
    remetente: ${EMAIL_REMETENTE}
  estudio:
    site-url: ${SITE_URL}
    api-url: ${API_URL}

logging:
  level:
    mz.netlineserv.chuangastudio: INFO
