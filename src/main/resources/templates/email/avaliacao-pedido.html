<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt"
      th:replace="~{email/layout :: layout(~{::conteudo}, 'Deixe-nos uma avaliação do seu atendimento de ' + ${data} + '. Leva menos de um minuto.')}">
<body>
<th:block th:fragment="conteudo">
    <th:block th:replace="~{email/componentes :: titulo('A sua opinião', 'Como', 'correu?')}"></th:block>
    <p style="margin:18px 0 0;font-family:'Manrope','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.7;color:#555e6f;">
        Olá <span th:text="${nome}">Ana</span>, obrigada por ter vindo ao Chuanga Studio. A sua opinião ajuda-nos
        a melhorar e ajuda outras clientes a escolher. Quantas estrelas dá ao atendimento?
    </p>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:24px;">
        <tr>
            <td th:each="e : ${estrelas}" style="padding-right:8px;">
                <a th:href="${e.preco}" style="display:inline-block;width:46px;height:46px;line-height:46px;text-align:center;border-radius:12px;background-color:#fdf0f5;color:#cd4686;font-size:24px;text-decoration:none;">&#9733;<span style="display:block;font-size:10px;line-height:10px;margin-top:-10px;font-family:'Manrope',Helvetica,Arial,sans-serif;" th:text="${e.nome}">1</span></a>
            </td>
        </tr>
    </table>
    <p style="margin:22px 0 0;font-family:'Manrope','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.7;color:#8a8fa0;">
        Atendimento de <span th:text="${data}">5 de outubro</span>: <span th:text="${servicos}">Verniz gel</span>
    </p>
    <table th:replace="~{email/componentes :: botao(${link}, 'Avaliar o atendimento')}"></table>
</th:block>
</body>
</html>
