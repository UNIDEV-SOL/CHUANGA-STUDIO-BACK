<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt"
      th:replace="~{email/layout :: layout(~{::conteudo}, ${clienteNome} + ' · ' + ${total})}">
<body>
<th:block th:fragment="conteudo">
    <th:block th:replace="~{email/componentes :: titulo('Aviso ao estúdio', 'Novo pedido de', 'cotação')}"></th:block>
    <p style="margin:18px 0 0;font-family:'Manrope','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.7;color:#555e6f;"><span th:text="${clienteNome}">Cliente</span> pediu uma cotação pelo site.</p>
    <table th:replace="~{email/componentes :: detalhes(${ {{'Cliente', clienteNome}, {'Telefone', clienteTelefone}, {'Email', clienteEmail ?: '—'}, {'Cotação nº', codigo}} })}"></table>
    <th:block th:replace="~{email/componentes :: servicos(${itens}, 'Total estimado', ${total})}"></th:block>
    <table th:if="${mensagem}" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:28px;background-color:#fdf0f5;border-left:4px solid #f893bc;border-radius:12px;">
        <tr><td style="padding:18px 20px;">
            <div style="font-family:'Manrope','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#cd4686;">Mensagem do cliente</div>
            <div style="margin-top:6px;font-family:'Manrope','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.7;color:#071123;"><span style="font-style:italic;" th:text="${mensagem}">Mensagem</span></div>
        </td></tr>
    </table>
    <table th:replace="~{email/componentes :: botao(${painelUrl}, 'Abrir no painel')}"></table>
    <p style="margin:22px 0 0;font-family:'Manrope','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.7;color:#8a8fa0;">
        Contactar o cliente:
        <a th:if="${clienteWhatsappUrl}" th:href="${clienteWhatsappUrl}" style="color:#cd4686;">WhatsApp</a>
        <th:block th:if="${clienteEmail}"> &middot; <a th:href="'mailto:' + ${clienteEmail}" th:text="${clienteEmail}" style="color:#cd4686;">email</a></th:block>
        <br>Pode responder diretamente a este email para escrever ao cliente.
    </p>
</th:block>
</body>
</html>
