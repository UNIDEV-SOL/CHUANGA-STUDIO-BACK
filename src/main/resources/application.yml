spring:
  application:
    name: chuanga-studio-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chuanga_studio}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:troque-esta-chave-em-producao-troque-esta-chave-em-producao}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 24h
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 dias

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    seed-email: ${ADMIN_SEED_EMAIL:admin@chuangastudio.co.mz}
    seed-password: ${ADMIN_SEED_PASSWORD:ChuangaAdmin123}

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    mz.netlineserv.chuangastudio: DEBUG
    org.springframework.security: INFO
